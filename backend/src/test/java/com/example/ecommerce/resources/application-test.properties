# H2 In-Memory Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Redis for tests (or use embedded)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Disable RabbitMQ for tests
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# JWT
application.security.jwt.secret-key=0MoQfENiTDdfQdciJ8/g7NBwNaY0NORUtkXbmgg5cvG/shqA9Pj378YqxHixqgzG
application.security.jwt.access-token-expiration=900000
application.security.jwt.refresh-token-expiration=604800000

# Disable Cache for tests
spring.cache.type=none
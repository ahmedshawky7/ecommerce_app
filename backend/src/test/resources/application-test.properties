# H2 In-Memory Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Redis & Cache for tests
spring.cache.type=simple

# Disable RabbitMQ auto-startup in tests
spring.rabbitmq.listener.simple.auto-startup=false

# JWT
application.security.jwt.secret-key=0MoQfENiTDdfQdciJ8/g7NBwNaY0NORUtkXbmgg5cvG/shqA9Pj378YqxHixqgzG
application.security.jwt.access-token-expiration=900000
application.security.jwt.refresh-token-expiration=604800000

# App Settings
app.cors.allowed-origins=http://localhost:5173
app.stripe.currency=usd
app.order.pending-expiration-minutes=30
app.pricing.tax-rate=0.14
app.pricing.shipping-fee=10.00
app.pricing.free-shipping-threshold=100.00

# Disable Mail in tests
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# Dummy external keys for tests
cloudinary.cloud-name=test
